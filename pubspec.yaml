name: eks_sana_plus_org
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

flutter_intl:
  enabled: true

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  rxdart: ^0.28.0
  cupertino_icons: ^1.0.2
  dio: ^5.3.2
  retrofit: ^4.4.1
  freezed_annotation: ^2.2.0
  flutter_bloc: ^8.0.1
  injectable: ^2.0.0
  get_it: ^7.2.0
  location: ^6.0.2
  flutter_map: ^6.0.1
  map_launcher: ^3.3.0
  pin_code_fields: ^8.0.1
  url_launcher: ^6.2.6
  sliding_up_panel: ^2.0.0+1
  persian_datetime_picker: ^2.7.0
  dots_indicator: ^3.0.0
  carousel_slider: ^5.0.0
  carousel_indicator: ^1.0.6
  expandable: ^5.0.1
  webview_flutter: ^4.8.0
  permission_handler: ^11.3.1
  app_links: ^6.1.1
  package_info_plus: ^7.0.0
  flutter_map_location_marker: ^8.0.2
  geolocator: ^10.1.0
  restart_app: ^1.2.1
  json_annotation: ^4.8.1
  flutter_svg: ^2.0.10+1
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^3.4.0
  connectivity_plus: ^6.0.3
  device_info_plus: ^10.1.0
  shimmer: ^3.0.0
  flutter_spinkit: 5.2.1
  flutter_animate: ^4.5.0
  firebase_core: ^2.32.0
  firebase_analytics: ^10.10.7
  path_provider: ^2.1.3
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^4.2.1
  go_router: ^15.1.2
  latlong2: ^0.9.1
  intl: ^0.19.0
  shamsi_date: ^1.1.1
  fl_chart:
    path: packages/fl_chart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  freezed: ^2.5.2
  build_runner: ^2.4.10
  injectable_generator: ^2.6.1
  retrofit_generator: ^8.2.1
  json_serializable: ^6.8.0
  enum_to_string: ^2.0.1
  js: ^0.7.1
  flutter_launcher_icons: ^0.13.1
  analyzer: ^6.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/png/
    - assets/icons/
    - assets/svg/
    - assets/fonts/

  fonts:
    - family: iransans_x
      fonts:
        - asset: assets/fonts/iransans_x/iran_sans_x_heavy.ttf
          weight: 900
        - asset: assets/fonts/iransans_x/iran_sans_x_extra_bold.ttf
          weight: 800
        - asset: assets/fonts/iransans_x/iran_sans_x_bold.ttf
          weight: 700
        - asset: assets/fonts/iransans_x/iran_sans_x_medium.ttf
          weight: 500
        - asset: assets/fonts/iransans_x/iran_sans_x_regular.ttf
          weight: 400
        - asset: assets/fonts/iransans_x/iran_sans_x_ight.ttf
          weight: 300
        - asset: assets/fonts/iransans_x/iran_sans_x_ultra_light.ttf
          weight: 200
        - asset: assets/fonts/iransans_x/iran_sans_x_thin.ttf
          weight: 100

    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Thin.ttf
          weight: 100
        - asset: assets/fonts/roboto/Roboto-ThinItalic.ttf
          weight: 100
          style: italic

        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/roboto/Roboto-LightItalic.ttf
          weight: 300
          style: italic

        - asset: assets/fonts/roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
          weight: 400
          style: italic

        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-MediumItalic.ttf
          weight: 500
          style: italic

        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/roboto/Roboto-BoldItalic.ttf
          weight: 700
          style: italic

        - asset: assets/fonts/roboto/Roboto-Black.ttf
          weight: 900
        - asset: assets/fonts/roboto/Roboto-BlackItalic.ttf
          weight: 900
          style: italic


