name: eks_sana_plus_org
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

flutter_intl:
  enabled: true

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  rxdart: ^0.28.0
  cupertino_icons: ^1.0.2
  dio: ^5.3.2
  retrofit: ^4.4.1
  freezed_annotation: ^3.1.0
  flutter_bloc: ^9.1.1
  injectable: ^3.0.0
  get_it: ^9.2.1
  location: ^8.0.1
  flutter_map: ^8.3.0
  map_launcher: ^4.5.0
  pin_code_fields: ^9.3.0
  url_launcher: ^6.2.6
  sliding_up_panel: ^2.0.0+1
  persian_datetime_picker: ^3.1.0
  dots_indicator: ^4.0.1
  carousel_slider: ^5.0.0
  carousel_indicator: ^1.0.6
  expandable: ^5.0.1
  webview_flutter: ^4.8.0
  permission_handler: ^12.0.1
  app_links: ^7.0.0
  package_info_plus: ^9.0.1
  app_settings: ^8.0.0
  flutter_map_location_marker: ^10.2.0
  geolocator: ^14.0.2
  restart_app: ^1.7.3
  json_annotation: ^4.11.0
  flutter_svg: ^2.0.10+1
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^3.4.0
  connectivity_plus: ^7.1.1
  device_info_plus: ^12.4.0
  shimmer: ^3.0.0
  flutter_spinkit: 5.2.2
  flutter_animate: ^4.5.0
  firebase_core: ^4.7.0
  firebase_analytics: ^12.3.0
  path_provider: ^2.1.3
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^10.0.0
  go_router: ^17.2.2
  latlong2: ^0.9.1
  intl: ^0.20.2
  shamsi_date: ^1.1.1
  image_picker: ^1.2.3
  open_filex: ^4.7.0
  fl_chart:
    path: packages/fl_chart
  dotted_border: ^3.1.0
  file_picker: ^11.0.2
  file_saver: ^0.4.0
  excel: ^4.0.6
  material_symbols_icons: ^4.2960.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  build_runner: ^2.4.10
  injectable_generator: ^3.0.2
  retrofit_generator: ^10.2.5
  json_serializable: ^6.8.0
  enum_to_string: ^2.0.1

#  js: ^0.7.1
#  flutter_launcher_icons: ^0.14.4
#  analyzer: ^10.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/png/
    - assets/svg/
    - assets/fonts/

  fonts:
    - family: iransans_x
      fonts:
        - asset: assets/fonts/iransans_x/iran_sans_x_heavy.ttf
          weight: 900
        - asset: assets/fonts/iransans_x/iran_sans_x_extra_bold.ttf
          weight: 800
        - asset: assets/fonts/iransans_x/iran_sans_x_bold.ttf
          weight: 700
        - asset: assets/fonts/iransans_x/iran_sans_x_medium.ttf
          weight: 500
        - asset: assets/fonts/iransans_x/iran_sans_x_regular.ttf
          weight: 400
        - asset: assets/fonts/iransans_x/iran_sans_x_ight.ttf
          weight: 300
        - asset: assets/fonts/iransans_x/iran_sans_x_ultra_light.ttf
          weight: 200
        - asset: assets/fonts/iransans_x/iran_sans_x_thin.ttf
          weight: 100

    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Thin.ttf
          weight: 100
        - asset: assets/fonts/roboto/Roboto-ThinItalic.ttf
          weight: 100
          style: italic

        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/roboto/Roboto-LightItalic.ttf
          weight: 300
          style: italic

        - asset: assets/fonts/roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
          weight: 400
          style: italic

        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-MediumItalic.ttf
          weight: 500
          style: italic

        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/roboto/Roboto-BoldItalic.ttf
          weight: 700
          style: italic

        - asset: assets/fonts/roboto/Roboto-Black.ttf
          weight: 900
        - asset: assets/fonts/roboto/Roboto-BlackItalic.ttf
          weight: 900
          style: italic


