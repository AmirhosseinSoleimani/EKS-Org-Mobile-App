ext.androidGradlePluginVersion = '8.10.1'

buildscript {
    configurations.classpath {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.android.tools.build' &&
                    details.requested.name == 'gradle') {
                details.useVersion rootProject.ext.androidGradlePluginVersion
                details.because 'Keep Flutter plugin buildscript classpaths aligned with the app AGP version for offline builds.'
            }
        }
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://storage.flutter-io.cn/download.flutter.io' }
    maven { url 'https://maven.myket.ir' }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

subprojects {
    buildscript {
        configurations.classpath {
            resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'com.android.tools.build' &&
                        details.requested.name == 'gradle') {
                    details.useVersion rootProject.ext.androidGradlePluginVersion
                    details.because 'Some Flutter plugins declare older AGP classpaths that may not exist in the offline Gradle cache.'
                }
            }
        }
    }

    configurations.configureEach {
        resolutionStrategy {
            force 'androidx.core:core:1.18.0'
            force 'androidx.core:core-ktx:1.18.0'
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
